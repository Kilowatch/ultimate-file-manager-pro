name: Build FOSS Debug APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-foss-debug:
    name: assembleMobileFossDebug + assembleTvFossDebug
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The UFM native build (libnfs via CMake) pins specific NDK + CMake
      # versions. Install them up-front so the build is deterministic, then
      # accept the SDK licenses so AGP can auto-fetch anything else it needs.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build FOSS debug APKs
        run: ./gradlew assembleMobileFossDebug assembleTvFossDebug --stacktrace

      - name: Upload Mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-foss-debug-apk
          path: app/build/outputs/apk/mobile/foss/debug/*.apk
          if-no-files-found: error

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-foss-debug-apk
          path: app/build/outputs/apk/tv/foss/debug/*.apk
          if-no-files-found: error
