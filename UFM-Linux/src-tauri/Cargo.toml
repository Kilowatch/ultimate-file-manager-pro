[package]
name = "ufm-linux"
version = "0.1.0"
description = "Ultimate File Manager Pro Native Linux Companion"
authors = ["Kilowatch <support@kilowatch.co.za>"]
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://github.com/Kilowatch/ultimate-file-manager-pro"
repository = "https://github.com/Kilowatch/ultimate-file-manager-pro"

[lib]
name = "ufm_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
sha2 = "0.10"
hex = "0.4"
get_if_addrs = "0.5"
